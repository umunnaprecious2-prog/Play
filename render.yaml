services:
  # Express + Prisma API
  - type: web
    name: play-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      # Migrated off Render's managed Postgres to Neon (the old play-db database has
      # been deleted). Set manually in the Render dashboard (Environment tab) to the
      # Neon direct (non-pooled) connection string -- sync: false keeps Blueprint syncs
      # from ever touching it. No credentials committed to the repo.
      - key: DATABASE_URL
        sync: false
      # Set these two in the Render dashboard after the first deploy (Environment tab) --
      # left unset here on purpose so no credentials ever get committed to the repo.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  # Next.js frontend, static-exported. Deployed as a Render Static Site
  # (files served directly, no live process) rather than a Web Service,
  # since this app has zero Next.js API routes of its own (every real API
  # call goes to the separate play-api service above) and every page already
  # builds as static/SSG content -- so it doesn't need a live server at all.
  # That means it never sleeps and never shows Render's own "waking up"
  # splash page, unlike a free-tier Web Service.
  #
  # This replaces a former "play-frontend" Web Service (deleted by the user
  # from the Render dashboard -- Blueprint sync can create new services but
  # can't convert or delete existing ones). That service's URL,
  # play-frontend-cz51.onrender.com, is permanently retired along with it --
  # Render doesn't allow a URL to be reassigned to a different service, by
  # rename or otherwise, so don't reintroduce a same-named service expecting
  # to recover it.
  - type: web
    name: play-frontend-static
    runtime: static
    rootDir: frontend
    buildCommand: npm install && CAPACITOR_BUILD=1 NEXT_PUBLIC_API_BASE_URL=https://play-api-hb7f.onrender.com/api npm run build
    staticPublishPath: ./out
