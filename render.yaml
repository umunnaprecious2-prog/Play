databases:
  - name: play-db
    plan: free
    postgresMajorVersion: "17"

services:
  # Express + Prisma API
  - type: web
    name: play-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      # Migrated off Render's managed Postgres (play-db) to Neon. Set manually in the
      # Render dashboard (Environment tab) -- sync: false means Blueprint syncs will
      # never overwrite it back to play-db's connection string. No credentials committed
      # to the repo. play-db itself is left defined above and untouched until it's
      # confirmed safe to remove.
      - key: DATABASE_URL
        sync: false
      # Set these two in the Render dashboard after the first deploy (Environment tab) --
      # left unset here on purpose so no credentials ever get committed to the repo.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  # Next.js frontend
  - type: web
    name: play-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # The "play-api" name was already taken on Render, so it got assigned this
      # suffixed URL instead of the plain https://play-api.onrender.com. If play-api
      # is ever recreated under a different name/URL, update this to match.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://play-api-hb7f.onrender.com/api
