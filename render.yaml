databases:
  - name: play-db
    plan: free
    postgresMajorVersion: "17"

services:
  # Express + Prisma API
  - type: web
    name: play-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: play-db
          property: connectionString
      # Set these two in the Render dashboard after the first deploy (Environment tab) --
      # left unset here on purpose so no credentials ever get committed to the repo.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  # Next.js frontend
  - type: web
    name: play-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Expected URL for the play-api service above. Render assigns this from the
      # service name unless that name is already taken globally, in which case Render
      # appends a suffix -- if so, update this value in the dashboard to match the
      # real backend URL and redeploy the frontend.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://play-api.onrender.com/api
