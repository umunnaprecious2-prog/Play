services:
  # Express + Prisma API
  - type: web
    name: play-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      # Migrated off Render's managed Postgres to Neon (the old play-db database has
      # been deleted). Set manually in the Render dashboard (Environment tab) to the
      # Neon direct (non-pooled) connection string -- sync: false keeps Blueprint syncs
      # from ever touching it. No credentials committed to the repo.
      - key: DATABASE_URL
        sync: false
      # Set these two in the Render dashboard after the first deploy (Environment tab) --
      # left unset here on purpose so no credentials ever get committed to the repo.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  # Next.js frontend (Web Service -- see play-frontend-static below, which is
  # replacing this). Left in place, unmodified, until play-frontend-static is
  # confirmed working live -- Render can't convert an existing service's type
  # in place via Blueprint sync, only create new ones, so the old one has to
  # be deleted manually in the dashboard once the new one is verified.
  - type: web
    name: play-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # The "play-api" name was already taken on Render, so it got assigned this
      # suffixed URL instead of the plain https://play-api.onrender.com. If play-api
      # is ever recreated under a different name/URL, update this to match.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://play-api-hb7f.onrender.com/api

  # Next.js frontend, static-exported. play-frontend above is a free-tier Web
  # Service, meaning it's a live Node process that Render puts to sleep after
  # inactivity -- the first request after that shows Render's own "waking
  # up" splash page (not this app's UI) and can take 50+ seconds. This app
  # has zero Next.js API routes of its own (every real API call goes to the
  # separate play-api service) and every page already builds as static/SSG
  # content, so it doesn't need a live server at all. A Render Static Site
  # serves pre-built files directly with no process to sleep -- eliminating
  # the splash-screen problem entirely, for free, rather than just reducing
  # its frequency the way the keep-alive ping (.github/workflows/keep-alive.yml)
  # does for services that do need to stay running.
  - type: web
    name: play-frontend-static
    runtime: static
    rootDir: frontend
    buildCommand: npm install && CAPACITOR_BUILD=1 NEXT_PUBLIC_API_BASE_URL=https://play-api-hb7f.onrender.com/api npm run build
    staticPublishPath: ./out
