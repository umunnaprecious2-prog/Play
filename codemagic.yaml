workflows:
  # iOS only -- Android builds happen locally now that Android Studio/SDK is
  # installed (see read.md's mobile launch roadmap). There's no way around
  # needing some Mac-based service for iOS without an actual Mac, so this
  # stays. Builds for the Simulator only -- no Apple Developer Program
  # enrollment or signing certificate needed for this. Real device builds and
  # TestFlight need code signing set up in the Codemagic dashboard (this
  # workflow -> Code signing -> iOS) once there's an Apple Developer account,
  # then switch to an archive + IPA export step.
  ios-simulator:
    name: iOS (Simulator build)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      # Capacitor 8's CLI requires Node >=22 (confirmed by a real build
      # failure on node: 20 -- "The Capacitor CLI requires NodeJS >=22.0.0").
      node: 22
      vars:
        NEXT_PUBLIC_API_BASE_URL: https://play-api-hb7f.onrender.com/api
    scripts:
      - name: Install frontend dependencies
        script: cd frontend && npm install
      - name: Build static export + sync Capacitor
        script: cd frontend && npm run cap:sync
      # No CocoaPods step: this project uses Capacitor's Swift Package
      # Manager integration (frontend/ios/App/CapApp-SPM), confirmed by a
      # real build failure -- "No `Podfile' found" -- since Capacitor 8
      # defaults to SPM, not CocoaPods. Xcode resolves the SPM dependency
      # automatically from App.xcodeproj directly; there's no .xcworkspace.
      - name: Build for iOS Simulator
        script: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build build
    artifacts:
      - frontend/ios/App/build/**/*.app
