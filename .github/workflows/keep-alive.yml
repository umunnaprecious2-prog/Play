name: Keep Render services warm

# Render's free tier spins a web service down after a period of inactivity,
# so the first real request after idle time can take 50+ seconds ("cold
# start") -- and while it's asleep, Render shows its OWN branded "waking up"
# splash page (ASCII art, server logs) before the real app ever loads, not
# anything from this codebase. play-api and play-frontend are two SEPARATE
# Render web services (render.yaml), each with its own independent idle
# clock, so both need their own ping -- pinging only the API left the
# frontend free to fall asleep on its own and show Render's raw splash
# screen to real visitors, which is what this fixed (previously this
# workflow only pinged the backend).
#
# Pinging on a schedule keeps both from going idle in the first place for
# most of the day, without paying for an always-on plan. This does not
# guarantee zero cold starts -- Render can still sleep a service between
# pings, or the schedule can be delayed under GitHub Actions' best-effort
# cron -- so the frontend app itself also has its own friendly "waking up"
# loading state (ColdStartBanner) for whenever a cold start still happens
# once the frontend has actually loaded.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 90 "https://play-api-hb7f.onrender.com/api/health" || \
          curl -fsS --max-time 90 "https://play-api-hb7f.onrender.com/api/health"
      - name: Ping frontend
        run: |
          curl -fsS --max-time 90 -o /dev/null "https://play-frontend-cz51.onrender.com/" || \
          curl -fsS --max-time 90 -o /dev/null "https://play-frontend-cz51.onrender.com/"
